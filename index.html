<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoices</title>
<meta name="theme-color" content="#244a38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invoices">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --teal: #537f8a;
    --stripe: #a9c4c8;
    --green: #244a38;
    --yellow: #fdf8c8;
    --text: #222;
    --muted: #555;
    --line: #c9d3d5;
    --bg: #eef2f3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; cursor: pointer; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--green); color: #fff;
  }
  .toolbar .title { font-weight: 700; font-size: 18px; margin-right: auto; }
  .btn {
    border: 0; border-radius: 8px; padding: 9px 14px;
    background: #fff; color: var(--green); font-weight: 700; font-size: 14px;
  }
  .btn.ghost { background: rgba(255,255,255,.15); color: #fff; }
  .btn.danger { background: #b3261e; color: #fff; }
  .btn:disabled { opacity: .5; }

  /* ---------- the invoice sheet ---------- */
  .wrap { padding: 16px; }
  .sheet {
    max-width: 816px; margin: 0 auto; background: #fff;
    padding: 28px 28px 36px; box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .logo {
    width: 110px; height: 110px; flex: none;
    background: var(--green); border-radius: 18px;
    border: 3px solid #fff; outline: 2px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 80px/1 Georgia, "Times New Roman", serif;
    text-shadow: 2px 2px 0 rgba(0,0,0,.35);
  }
  .biz { text-align: right; line-height: 1.9; font-size: 15px; color: #333; }
  .biz .name { font-size: 22px; font-weight: 700; color: #000; line-height: 1.4; }
  .band {
    margin: 22px 0 10px; background: var(--teal); color: #fff;
    font-size: 34px; font-weight: 700; padding: 14px 8px;
  }
  .meta { display: grid; grid-template-columns: auto 190px; gap: 4px 6px; justify-content: end; align-items: center; }
  .meta label { font-weight: 700; color: var(--muted); text-align: right; }
  .meta .box {
    background: var(--yellow); border: 1px solid #d9d39a; text-align: center;
    padding: 3px 6px; font-size: 15px; min-height: 26px;
  }
  .cust { margin: 26px 0 40px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; max-width: 560px; }
  .cust label { font-weight: 700; color: var(--muted); font-size: 17px; }
  .cust .val { font-size: 16px; min-height: 22px; }

  table.items { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.items th {
    background: var(--teal); color: #fff; font-size: 17px; padding: 10px 6px;
    border-right: 1px solid var(--line); text-align: center;
  }
  table.items th:first-child { text-align: left; }
  table.items td {
    height: 34px; padding: 0 6px; border-right: 1px solid var(--line);
    border-bottom: 1px solid #d6dfe0; font-size: 15px;
  }
  table.items tr:nth-child(even) td { background: var(--stripe); }
  table.items td.num { text-align: right; }
  table.items td.ctr { text-align: center; }
  col.c-desc { width: 44%; } col.c-qty { width: 16%; } col.c-price { width: 18%; } col.c-cost { width: 18%; } col.c-x { width: 4%; }
  .total-row { display: flex; justify-content: flex-end; }
  .total {
    display: grid; grid-template-columns: 1fr 1fr; width: 36%; min-width: 220px;
    border-top: 2px solid var(--green); padding-top: 8px;
    color: var(--green); font-weight: 700; font-size: 19px;
  }
  .total span:last-child { text-align: right; padding-right: 6px; }
  .notes { margin-top: 28px; font-size: 14px; color: #333; white-space: pre-wrap; }
  .notes b { color: var(--muted); }

  /* ---------- editable inputs (look like plain cells) ---------- */
  .sheet input, .sheet textarea {
    font: inherit; color: inherit; background: transparent;
    border: 0; outline: none; width: 100%; padding: 4px 2px; margin: 0;
  }
  .sheet input:focus, .sheet textarea:focus { background: rgba(255,255,255,.75); box-shadow: inset 0 0 0 2px var(--teal); }
  .sheet .box input { text-align: center; padding: 1px; }
  table.items input { height: 32px; }
  table.items input.num { text-align: right; }
  table.items input.ctr { text-align: center; }
  .x { border: 0; background: none; color: #8a2a2a; font-size: 18px; width: 100%; padding: 0; }
  .add-line { margin-top: 8px; background: none; border: 1px dashed var(--teal); color: var(--teal); border-radius: 6px; padding: 7px 12px; font-weight: 700; }
  .sheet textarea { border: 1px solid var(--line); border-radius: 6px; min-height: 60px; resize: vertical; }

  /* ---------- panels ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .overlay.open { display: block; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
    background: #fff; z-index: 21; overflow-y: auto; padding: 18px 16px 40px;
    transform: translateX(100%); transition: transform .2s;
    padding-top: max(18px, env(safe-area-inset-top));
  }
  .panel.open { transform: none; }
  .panel h2 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; color: var(--green); }
  .panel .close { border: 0; background: none; font-size: 26px; color: #666; }
  .inv-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .inv-item .top { display: flex; justify-content: space-between; font-weight: 700; }
  .inv-item .sub { color: #666; font-size: 13px; margin: 3px 0 8px; }
  .inv-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .inv-item .acts button { border: 1px solid var(--line); background: #f6f8f8; border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #fde8c8; color: #8a5300; margin-left: 6px; vertical-align: middle; }
  .pill.paid { background: #d5efd9; color: #1d6b2c; }
  .search { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  .form label { display: block; font-size: 13px; font-weight: 700; color: #555; margin: 10px 0 4px; }
  .form input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
  .empty { color: #777; text-align: center; padding: 30px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 30;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }

  /* off-screen static copy used to build the PDF / print */
  #render { position: fixed; left: -10000px; top: 0; width: 816px; }
  #render .sheet { box-shadow: none; margin: 0; width: 816px; max-width: none; padding: 40px 44px; }
  .pdfwrap { width: 758px; }
  .pdfwrap .sheet { box-shadow: none; margin: 0; width: 758px; max-width: none; padding: 20px 16px; }

  /* ---------- phone ---------- */
  @media (max-width: 640px) {
    .wrap { padding: 8px; }
    .sheet { padding: 16px 12px 24px; }
    .logo { width: 64px; height: 64px; font-size: 46px; border-radius: 12px; }
    .biz { font-size: 12px; line-height: 1.6; }
    .biz .name { font-size: 17px; }
    .band { font-size: 24px; padding: 10px 8px; }
    .meta { grid-template-columns: auto 130px; }
    .cust { margin: 18px 0 24px; }
    .cust label { font-size: 14px; }
    table.items th { font-size: 12px; padding: 8px 3px; }
    table.items td { font-size: 14px; padding: 0 3px; }
    col.c-desc { width: 36%; } col.c-qty { width: 15%; } col.c-price { width: 21%; } col.c-cost { width: 21%; } col.c-x { width: 7%; }
    .total { width: 60%; font-size: 17px; }
    .toolbar .title { width: 100%; }
    .btn { padding: 8px 11px; font-size: 13px; }
  }

  /* ---------- print ---------- */
  @page { size: letter; margin: 0.4in; }
  @media print {
    body { background: #fff; }
    .toolbar, .wrap, .overlay, .panel, .toast { display: none !important; }
    #render { position: static; width: auto; }
    #render .sheet { width: auto; padding: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="title">Invoices</div>
  <button class="btn ghost" id="bNew">+ New</button>
  <button class="btn ghost" id="bList">Saved</button>
  <button class="btn ghost" id="bSettings">My Info</button>
  <button class="btn" id="bPrint">Print</button>
  <button class="btn" id="bPdf">PDF</button>
  <button class="btn" id="bEmail">Email</button>
</div>

<div class="wrap">
  <div class="sheet" id="editor">
    <div class="head">
      <div class="logo" id="eLogo">J</div>
      <div class="biz" id="eBiz"></div>
    </div>
    <div class="band">INVOICE</div>
    <div class="meta">
      <label for="fNum">Invoice #:</label><div class="box"><input id="fNum" inputmode="numeric"></div>
      <label for="fDate">Date:</label><div class="box"><input id="fDate" type="date"></div>
    </div>
    <div class="cust">
      <label for="fName">Customer Name:</label><input id="fName" list="custList" placeholder="Type or pick a customer" autocomplete="off">
      <label for="fEmail">Email:</label><input id="fEmail" type="email" placeholder="—">
      <label for="fPhone">Phone:</label><input id="fPhone" type="tel" placeholder="—">
      <label for="fAttn">Attention:</label><input id="fAttn" placeholder="—">
    </div>
    <datalist id="custList"></datalist>

    <table class="items">
      <colgroup><col class="c-desc"><col class="c-qty"><col class="c-price"><col class="c-cost"><col class="c-x"></colgroup>
      <thead><tr><th>Description</th><th>Quantity</th><th>Price Per</th><th>Cost</th><th></th></tr></thead>
      <tbody id="eRows"></tbody>
    </table>
    <button class="add-line" id="bAdd">+ Add line</button>
    <div class="total-row"><div class="total"><span>Total Cost</span><span id="eTotal">$0.00</span></div></div>

    <div style="margin-top:24px">
      <label for="fNotes" style="font-weight:700;color:var(--muted)">Notes (optional)</label>
      <textarea id="fNotes" placeholder="e.g. Payment due within 30 days. Thank you!"></textarea>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:700;color:var(--muted)">
      <input type="checkbox" id="fPaid" style="width:auto"> Paid
    </label>
  </div>
</div>

<div id="render"></div>

<div class="overlay" id="overlay"></div>

<div class="panel" id="pList">
  <h2>Saved Invoices <button class="close" data-close>&times;</button></h2>
  <input class="search" id="search" placeholder="Search customer or #">
  <div id="listBody"></div>
</div>

<div class="panel" id="pSettings">
  <h2>My Info <button class="close" data-close>&times;</button></h2>
  <div class="form">
    <label>Name / Business</label><input id="sName">
    <label>Phone</label><input id="sPhone" type="tel">
    <label>Email</label><input id="sEmail" type="email">
    <label>Address</label><input id="sAddr">
    <label>Logo letter</label><input id="sLogo" maxlength="2">
    <label>Next invoice #</label><input id="sNext" inputmode="numeric">
  </div>
  <p style="color:#666;font-size:13px;margin-top:16px">Everything is saved on this device only. Use <b>Backup</b> to keep a copy.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" style="background:var(--green);color:#fff" id="bBackup">Backup (download)</button>
    <label class="btn" style="background:#f0f3f3;cursor:pointer">Restore<input type="file" id="fRestore" accept=".json" hidden></label>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const DEFAULT_SETTINGS = {
  name: "Jason Koehn", phone: "", email: "",
  addr: "", logo: "J", next: 1001,
};
let settings = Object.assign({}, DEFAULT_SETTINGS, store.get("inv_settings", {}));
let invoices = store.get("inv_invoices", []);
let cur = null;

const money = (n) => (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${m}/${d}/${y}`; };
const lineCost = (l) => (parseFloat(l.qty) || 0) * (parseFloat(String(l.price).replace(/[$,]/g, "")) || 0);
const total = (inv) => inv.lines.reduce((s, l) => s + lineCost(l), 0);
const hasContent = (inv) => inv.customer.name || inv.lines.some((l) => l.desc || l.qty || l.price);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

function blankInvoice() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    num: String(settings.next), date: today(),
    customer: { name: "", email: "", phone: "", attn: "" },
    lines: Array.from({ length: 4 }, () => ({ desc: "", qty: "", price: "" })),
    notes: "", paid: false,
  };
}

/* ---------- persistence ---------- */
function save() {
  if (!cur) return;
  const i = invoices.findIndex((x) => x.id === cur.id);
  if (i === -1) {
    if (!hasContent(cur)) return;
    invoices.unshift(cur);
    const n = parseInt(cur.num, 10);
    if (!isNaN(n) && n >= settings.next) { settings.next = n + 1; store.set("inv_settings", settings); }
  } else invoices[i] = cur;
  cur.updated = Date.now();
  store.set("inv_invoices", invoices);
  store.set("inv_current", cur.id);
  // remember customers
  const c = cur.customer;
  if (c.name) {
    const custs = store.get("inv_customers", {});
    custs[c.name.toLowerCase()] = { ...c };
    store.set("inv_customers", custs);
    fillCustList();
  }
}

/* ---------- editor ---------- */
function renderBiz() {
  $("eLogo").textContent = settings.logo || "";
  $("eBiz").innerHTML = bizHtml();
}
function bizHtml() {
  return `<div class="name">${esc(settings.name)}</div><div>${esc(settings.phone)}</div><div>${esc(settings.email)}</div><div>${esc(settings.addr)}</div>`;
}
function fillCustList() {
  const custs = store.get("inv_customers", {});
  $("custList").innerHTML = Object.values(custs).map((c) => `<option value="${esc(c.name)}">`).join("");
}

function loadEditor() {
  $("fNum").value = cur.num; $("fDate").value = cur.date;
  $("fName").value = cur.customer.name; $("fEmail").value = cur.customer.email;
  $("fPhone").value = cur.customer.phone; $("fAttn").value = cur.customer.attn;
  $("fNotes").value = cur.notes || ""; $("fPaid").checked = !!cur.paid;
  renderRows();
}
function renderRows() {
  $("eRows").innerHTML = cur.lines.map((l, i) => `
    <tr data-i="${i}">
      <td><input data-k="desc" value="${esc(l.desc)}"></td>
      <td><input data-k="qty" class="ctr" inputmode="decimal" value="${esc(l.qty)}"></td>
      <td><input data-k="price" class="num" inputmode="decimal" value="${esc(l.price)}"></td>
      <td class="num" data-cost>${lineCost(l) ? money(lineCost(l)) : ""}</td>
      <td><button class="x" title="Remove line" data-del>&times;</button></td>
    </tr>`).join("");
  $("eTotal").textContent = money(total(cur));
}
$("eRows").addEventListener("input", (e) => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const l = cur.lines[tr.dataset.i]; l[e.target.dataset.k] = e.target.value;
  tr.querySelector("[data-cost]").textContent = lineCost(l) ? money(lineCost(l)) : "";
  $("eTotal").textContent = money(total(cur));
  save();
});
$("eRows").addEventListener("click", (e) => {
  if (!e.target.matches("[data-del]")) return;
  const i = +e.target.closest("tr").dataset.i;
  cur.lines.splice(i, 1);
  if (!cur.lines.length) cur.lines.push({ desc: "", qty: "", price: "" });
  renderRows(); save();
});
$("bAdd").onclick = () => {
  cur.lines.push({ desc: "", qty: "", price: "" }); renderRows();
  $("eRows").lastElementChild.querySelector("input").focus();
};
const bind = (id, fn) => $(id).addEventListener("input", () => { fn($(id)); save(); });
bind("fNum", (el) => (cur.num = el.value));
bind("fDate", (el) => (cur.date = el.value));
bind("fEmail", (el) => (cur.customer.email = el.value));
bind("fPhone", (el) => (cur.customer.phone = el.value));
bind("fAttn", (el) => (cur.customer.attn = el.value));
bind("fNotes", (el) => (cur.notes = el.value));
$("fPaid").addEventListener("change", (e) => { cur.paid = e.target.checked; save(); });
bind("fName", (el) => {
  cur.customer.name = el.value;
  const known = store.get("inv_customers", {})[el.value.toLowerCase()];
  if (known) {
    cur.customer = { ...known };
    $("fEmail").value = known.email; $("fPhone").value = known.phone; $("fAttn").value = known.attn;
  }
});

/* ---------- static invoice (print / PDF) ---------- */
function staticHtml(inv) {
  const filled = inv.lines.filter((l) => l.desc || l.qty || l.price);
  const rows = filled.slice();
  while (rows.length < 12) rows.push(null);
  const custRow = (label, v) => `<label>${label}</label><div class="val">${esc(v)}</div>`;
  return `<div class="sheet">
    <div class="head"><div class="logo">${esc(settings.logo)}</div><div class="biz">${bizHtml()}</div></div>
    <div class="band">INVOICE</div>
    <div class="meta">
      <label>Invoice #:</label><div class="box">${esc(inv.num)}</div>
      <label>Date:</label><div class="box">${fmtDate(inv.date)}</div>
    </div>
    <div class="cust">
      ${custRow("Customer Name:", inv.customer.name)}${custRow("Email:", inv.customer.email)}
      ${custRow("Phone:", inv.customer.phone)}${custRow("Attention:", inv.customer.attn)}
    </div>
    <table class="items">
      <colgroup><col style="width:34%"><col style="width:20%"><col style="width:16%"><col style="width:16%"><col style="width:14%"></colgroup>
      <thead><tr><th>Description</th><th>Quantity</th><th>Price Per</th><th>Cost</th><th></th></tr></thead>
      <tbody>${rows.map((l) => l ? `<tr><td>${esc(l.desc)}</td><td class="ctr">${esc(l.qty)}</td><td class="num">${l.price !== "" ? money(String(l.price).replace(/[$,]/g, "")) : ""}</td><td class="num">${money(lineCost(l))}</td><td></td></tr>` : `<tr><td></td><td></td><td></td><td></td><td></td></tr>`).join("")}</tbody>
    </table>
    <div class="total-row"><div class="total"><span>Total Cost</span><span>${money(total(inv))}</span></div></div>
    ${inv.notes ? `<div class="notes"><b>Notes:</b><br>${esc(inv.notes)}</div>` : ""}
    ${inv.paid ? `<div style="margin-top:24px;color:#1d6b2c;font-weight:700;font-size:20px">PAID — Thank you!</div>` : ""}
  </div>`;
}
const fileName = (inv) => `Invoice-${inv.num}${inv.customer.name ? "-" + inv.customer.name.replace(/[^\w]+/g, "_") : ""}.pdf`;

function pdfWorker(inv) {
  const html = `<div class="pdfwrap">${staticHtml(inv)}</div>`;
  return html2pdf().set({
    margin: [0.3, 0.3, 0.3, 0.3], filename: fileName(inv),
    image: { type: "jpeg", quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true, windowWidth: 1024, scrollY: 0, scrollX: 0 },
    jsPDF: { unit: "in", format: "letter", orientation: "portrait" },
  }).from(html, "string");
}
async function pdfBlob(inv) { return pdfWorker(inv).outputPdf("blob"); }

function needsCustomer() {
  if (!hasContent(cur)) { toast("Add a customer or a line item first"); return true; }
  return false;
}

$("bPrint").onclick = () => {
  save(); $("render").innerHTML = staticHtml(cur);
  setTimeout(() => window.print(), 50);
};
$("bPdf").onclick = async () => {
  if (needsCustomer()) return;
  save(); toast("Making PDF…");
  try {
    const blob = await pdfBlob(cur);
    const file = new File([blob], fileName(cur), { type: "application/pdf" });
    // On iPhone/iPad the share sheet is the way to "Save to Files"
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: fileName(cur) }).catch(() => {});
    } else downloadBlob(blob, fileName(cur));
  } catch (e) { console.error(e); toast("Couldn't make the PDF"); }
};
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$("bEmail").onclick = async () => {
  if (needsCustomer()) return;
  save();
  const inv = cur;
  const subject = `Invoice #${inv.num} from ${settings.name}`;
  const body =
    `Hi ${inv.customer.attn || inv.customer.name || ""},\n\n` +
    `Attached is invoice #${inv.num} dated ${fmtDate(inv.date)} for ${money(total(inv))}.\n\n` +
    `Thank you!\n\n${settings.name}\n${settings.phone}\n${settings.email}`;
  toast("Making PDF…");
  let blob;
  try { blob = await pdfBlob(inv); } catch (e) { console.error(e); toast("Couldn't make the PDF"); return; }
  const file = new File([blob], fileName(inv), { type: "application/pdf" });
  // Share sheet: pick Mail and the PDF is already attached (iPhone, iPad, Mac Safari/Chrome)
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: subject, text: body }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  // Fallback: download the PDF and open a pre-filled email to attach it to
  downloadBlob(blob, fileName(inv));
  location.href = `mailto:${encodeURIComponent(inv.customer.email || "")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  toast("PDF downloaded — attach it to the email");
};

/* ---------- new / list ---------- */
$("bNew").onclick = () => {
  save(); cur = blankInvoice(); loadEditor(); store.set("inv_current", cur.id);
  window.scrollTo(0, 0); $("fName").focus();
};

function openPanel(id) { $("overlay").classList.add("open"); $(id).classList.add("open"); }
function closePanels() { $("overlay").classList.remove("open"); document.querySelectorAll(".panel").forEach((p) => p.classList.remove("open")); }
$("overlay").onclick = closePanels;
document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closePanels));

$("bList").onclick = () => { save(); renderList(); openPanel("pList"); };
$("search").oninput = renderList;
function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const list = invoices.filter((i) => !q || i.num.includes(q) || i.customer.name.toLowerCase().includes(q));
  const owed = invoices.filter((i) => !i.paid).reduce((s, i) => s + total(i), 0);
  $("listBody").innerHTML =
    `<div style="font-size:13px;color:#555;margin-bottom:10px">${invoices.length} invoices · Unpaid: <b>${money(owed)}</b></div>` +
    (list.length ? list.map((i) => `
    <div class="inv-item" data-id="${i.id}">
      <div class="top"><span>#${esc(i.num)} ${esc(i.customer.name || "(no name)")}<span class="pill ${i.paid ? "paid" : ""}">${i.paid ? "Paid" : "Unpaid"}</span></span><span>${money(total(i))}</span></div>
      <div class="sub">${fmtDate(i.date)}</div>
      <div class="acts">
        <button data-a="open">Open</button>
        <button data-a="paid">${i.paid ? "Mark unpaid" : "Mark paid"}</button>
        <button data-a="copy">Duplicate</button>
        <button data-a="del" style="color:#b3261e">Delete</button>
      </div>
    </div>`).join("") : `<div class="empty">No invoices yet</div>`);
}
$("listBody").onclick = (e) => {
  const a = e.target.dataset.a; if (!a) return;
  const id = e.target.closest(".inv-item").dataset.id;
  const inv = invoices.find((x) => x.id === id);
  if (a === "open") { cur = inv; loadEditor(); store.set("inv_current", id); closePanels(); }
  if (a === "paid") { inv.paid = !inv.paid; store.set("inv_invoices", invoices); if (cur.id === id) $("fPaid").checked = inv.paid; renderList(); }
  if (a === "copy") {
    const c = JSON.parse(JSON.stringify(inv));
    Object.assign(c, { id: blankInvoice().id, num: String(settings.next), date: today(), paid: false });
    cur = c; save(); loadEditor(); closePanels(); toast(`Copied to #${c.num}`);
  }
  if (a === "del" && confirm(`Delete invoice #${inv.num}? This can't be undone.`)) {
    invoices = invoices.filter((x) => x.id !== id); store.set("inv_invoices", invoices);
    if (cur.id === id) { cur = blankInvoice(); loadEditor(); }
    renderList();
  }
};

/* ---------- settings ---------- */
const sMap = { sName: "name", sPhone: "phone", sEmail: "email", sAddr: "addr", sLogo: "logo", sNext: "next" };
$("bSettings").onclick = () => {
  for (const [id, k] of Object.entries(sMap)) $(id).value = settings[k];
  openPanel("pSettings");
};
for (const [id, k] of Object.entries(sMap)) {
  $(id).addEventListener("input", () => {
    settings[k] = k === "next" ? parseInt($(id).value, 10) || settings.next : $(id).value;
    store.set("inv_settings", settings); renderBiz();
  });
}
$("bBackup").onclick = () => {
  const data = { settings, invoices, customers: store.get("inv_customers", {}) };
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), `invoices-backup-${today()}.json`);
};
$("fRestore").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.invoices)) throw 0;
    if (!confirm(`Restore ${data.invoices.length} invoices? This replaces what's on this device.`)) return;
    settings = Object.assign({}, DEFAULT_SETTINGS, data.settings); invoices = data.invoices;
    store.set("inv_settings", settings); store.set("inv_invoices", invoices); store.set("inv_customers", data.customers || {});
    cur = invoices[0] || blankInvoice(); renderBiz(); fillCustList(); loadEditor(); closePanels(); toast("Restored");
  } catch { toast("That file isn't an invoice backup"); }
};

/* ---------- start ---------- */
renderBiz(); fillCustList();
cur = invoices.find((x) => x.id === store.get("inv_current")) || blankInvoice();
loadEditor();
if (!localStorage.getItem("inv_settings")) { $("bSettings").click(); toast("Enter your info once — it goes on every invoice"); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
